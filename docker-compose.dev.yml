# Local Docker environment (http://localhost through Nginx).
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.docker up --build
#
# Optional Rate Limit test mode (TEST_RATE_LIMITS, not production):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.rate-limit.yml --env-file .env.docker up --build
#
# Isolated from production: project name poulix-dev and volume poulix_dev_postgres.
# PostgreSQL, backend, and frontend are not published on the host.

name: poulix-dev

volumes:
  postgres_data:
    name: poulix_dev_postgres

services:
  postgres:
    env_file:
      - .env.docker

  backend:
    env_file:
      - .env.docker
    environment:
      APP_ENV: development

  frontend:
    env_file:
      - .env.docker
    environment:
      APP_ENV: development

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_locations.conf:/etc/nginx/proxy_locations.conf:ro
    # Local HTTP does not use TLS. Production cert entrypoint stays unchanged.
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]

  backend-test:
    env_file:
      - .env.docker
    environment:
      NODE_ENV: test
      APP_ENV: test
      RATE_LIMIT_ENABLED: "false"
      REDIS_URL: ""

  backend-test-rate-limit:
    env_file:
      - .env.docker
    environment:
      NODE_ENV: test
      APP_ENV: test
      RATE_LIMIT_ENABLED: "true"
      REDIS_URL: ""
