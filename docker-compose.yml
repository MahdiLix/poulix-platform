# Shared Compose services. Do not start this file alone.
# Local:      docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.docker up --build
# Local RL:   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.rate-limit.yml --env-file .env.docker up --build
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Frontend (3000), backend (3001), and PostgreSQL stay on the Compose network.
# Nginx is the only public entry point (ports are published in the env overlay).

networks:
  poulix:
    driver: bridge

volumes:
  postgres_data:

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - poulix
    expose:
      - "6379"
    # Temporary rate-limit counters only: no disk persistence, tiny memory cap.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "32mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - poulix
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    networks:
      - poulix
    # Public DNS is required when the host resolver is not inherited
    # (VPN/tether), which otherwise makes sandbox.zarinpal.com fail with EAI_AGAIN.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:3001}
    restart: unless-stopped
    networks:
      - poulix
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    networks:
      - poulix
    depends_on:
      - frontend
      - backend

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    networks:
      - poulix
    environment:
      NODE_ENV: test
      APP_ENV: test
      RATE_LIMIT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test
    networks:
      - poulix

  backend-test-rate-limit:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    networks:
      - poulix
    environment:
      NODE_ENV: test
      APP_ENV: test
      RATE_LIMIT_ENABLED: "true"
    command: ["npm", "run", "test:rate-limit"]
    depends_on:
      postgres:
        condition: service_healthy
