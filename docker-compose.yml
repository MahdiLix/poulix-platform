# Dual-mode local setup:
# 1) Full stack:
#      cp .env.docker.example .env.docker
#      docker compose --env-file .env.docker up --build

# 2) Host Node.js + Docker Postgres only:
#      docker compose --env-file .env.docker up postgres
#      then use backend/.env and frontend/.env.local with localhost URLs

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    env_file:
      - .env.docker
    environment:
      NODE_ENV: test
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:3001}
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
