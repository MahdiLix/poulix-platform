user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Cloudflare sends the browser scheme in X-Forwarded-Proto.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream poulix_frontend {
        server frontend:3000;
    }

    upstream poulix_backend {
        server backend:3001;
    }

    # Local Docker (http://localhost). Do not proxy unmatched Host headers:
    # on a public VPS that would skip Cloudflare and allow callback spoofing.
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        include /etc/nginx/proxy_locations.conf;
    }

    # HTTP for both hostnames → canonical HTTPS.
    server {
        listen 80;
        server_name poulix.ir www.poulix.ir;

        return 301 https://poulix.ir$request_uri;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # www is not canonical; keep TLS so Cloudflare Full Strict works, then redirect.
    server {
        listen 443 ssl http2;
        server_name www.poulix.ir;

        include /etc/nginx/ssl_params.conf;

        return 301 https://poulix.ir$request_uri;
    }

    # Canonical production HTTPS.
    server {
        listen 443 ssl http2;
        server_name poulix.ir;

        include /etc/nginx/ssl_params.conf;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        include /etc/nginx/proxy_locations.conf;
    }

    server {
        listen 443 ssl http2 default_server;
        server_name _;
        include /etc/nginx/ssl_params.conf;
        return 444;
    }
}
