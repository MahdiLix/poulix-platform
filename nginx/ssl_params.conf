# TLS settings shared by poulix.ir and www.poulix.ir on port 443.
# Files come from the host directory /etc/nginx/certs (mounted into the container).
# origin.crt / origin.key: Cloudflare Origin Certificate (server TLS).
# client.crt: Cloudflare Authenticated Origin Pull client certificate (verify Cloudflare).
# client.key is not used by Nginx; Cloudflare presents that client cert.

ssl_certificate           /etc/nginx/certs/origin.crt;
ssl_certificate_key       /etc/nginx/certs/origin.key;
ssl_client_certificate    /etc/nginx/certs/client.crt;
ssl_verify_client         on;
ssl_verify_depth          2;

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;